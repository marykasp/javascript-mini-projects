<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Guess Word Game</title>
  </head>
  <body>
    <div class="container">
      <h2>Guess the Word</h2>
      <div class="content">
        <input type="text" class="typing-input" maxlength="1" />
        <div class="inputs"></div>
        <div class="details">
          <p class="hint">Hint: <span>Hint shown here</span></p>
          <p class="guess-left">Remaining Guesses: <span>10</span></p>
          <!-- display a list of all the incorrect letters guessed -->
          <p class="wrong-letter">Wrong letters: <span>a, b, c, d</span></p>
        </div>
        <button class="reset-btn">Reset Game</button>
      </div>
    </div>

    <script src="js/words.js" defer></script>
    <script src="js/script.js" defer></script>
  </body>
</html>
